spring.application.name=anemiaguard
server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/anemia_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Copilot / OpenAI-compatible chat completions ----
# provider: "openai" -> Authorization: Bearer <key> | "azure" -> api-key: <key>
# Azure example URL:
#   https://<resource>.openai.azure.com/openai/deployments/<deployment>/chat/completions?api-version=2024-06-01
# Leave the key empty to use the built-in rule-based fallback report.
copilot.api.provider=${COPILOT_PROVIDER:openai}
copilot.api.url=${COPILOT_API_URL:https://api.openai.com/v1/chat/completions}
copilot.api.key=${COPILOT_API_KEY:}
copilot.api.model=${COPILOT_MODEL:gpt-4o-mini}